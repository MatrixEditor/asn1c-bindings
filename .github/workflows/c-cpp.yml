name: C/C++ CI

on:
  push:
    branches: [ vlm_master ]
  pull_request:
    branches: [ vlm_master ]

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: preconf
      run: autoreconf -ivf
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck
    - name: test PKIX1 example
      run: |
        cd examples/sample.source.PKIX1
        make regen-makefile
        make
        ./x509dump -iber -oxer sample-Certificate-1.der > /tmp/test-output.xml
        test -s /tmp/test-output.xml
        echo "PKIX1 example test passed"
